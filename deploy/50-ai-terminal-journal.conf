# Keep the journal, so the two units have a failure history.
#
# Raspberry Pi OS ships Storage=volatile, in
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf.
# Under it journald writes one system.journal into /run
# and no per-user journal at all, so `journalctl --user -u ai-terminal-tunnel`
# answers "No journal files were found" and everything is gone at the next
# boot. Both units here are Restart=always and are designed around failing and
# retrying — the tunnel every 30 s forever so it survives the Mac sleeping, the
# kiosk behind an ExecStartPre gate that holds, fails and retries — so their
# failures are the interesting half of their history, and without this the only
# evidence left after the fact is NRestarts: a counter with no timestamps, no
# exit statuses and no reasons, reset by a daemon-reload.
#
# 50- so it sorts after the 40- the OS ships. Install to
# /etc/systemd/journald.conf.d/, which wins over /usr/lib either way.
#
# Capped rather than left to the default 10% of the filesystem, which on a
# 117 GB card is 11 GB of SD-card writes nobody asked for.
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=1month
