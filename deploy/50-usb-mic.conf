# WirePlumber 0.5 configuration for USB microphone priority
# Gives USB audio capture devices higher priority than the ReSpeaker HAT
# so the exposed front USB microphone becomes the default audio source.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*usb.*"
      },
      {
        device.nick = "USB Composite Device"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2500
      }
    }
  }
]
