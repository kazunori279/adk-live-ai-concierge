[project]
name = "raspi-ai-terminal"
version = "0.1.0"
description = "ADK Live AI Concierge on Raspberry Pi 5 with a touch screen"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "openwakeword>=0.6.0",
    "scipy>=1.14",
    "sounddevice>=0.5",
    # Live voice agent server
    "fastapi>=0.115",
    "google-adk>=2.8.0",
    "google-auth>=2.35",
    "pypdf>=5.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn[standard]>=0.32",
    "playwright>=1.62.0",
]

[project.scripts]
wake = "ai_terminal.wake:main"
live-server = "ai_terminal.live.main:run"

[tool.uv]
# openWakeWord declares a hard dependency on tflite-runtime for Linux, and
# tflite-runtime publishes no wheel past cp311. Raspberry Pi OS Trixie ships
# Python 3.13, so we run openWakeWord's ONNX inference path instead and drop
# the dependency. The marker is one uv can prove false against requires-python.
override-dependencies = ["tflite-runtime; python_version < '3.13'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_terminal"]
